name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: decoderbench
          POSTGRES_USER: decoderbench
          POSTGRES_PASSWORD: decoderbench_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U decoderbench -d decoderbench"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://decoderbench:decoderbench_dev@127.0.0.1:5432/decoderbench
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run python manage.py check
      - run: uv run pytest

