<form class="filter-bar" action="{{ action }}" method="get">
  <div>
    <label for="{{ id_prefix }}-search">Search</label>
    <input id="{{ id_prefix }}-search" type="search" name="q" value="{{ query }}" placeholder="{{ placeholder }}">
  </div>
  <div>
    <label for="{{ id_prefix }}-tag">Tag</label>
    <select id="{{ id_prefix }}-tag" name="tag">
      <option value="">All tags</option>
      {% for tag in filter_tags %}<option value="{{ tag.slug }}">{{ tag.label }}</option>{% endfor %}
    </select>
  </div>
  <button type="submit">Apply</button>
  <button class="button-secondary" type="button">More filters</button>
</form>
