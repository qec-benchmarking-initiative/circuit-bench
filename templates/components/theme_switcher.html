<div class="theme-switcher" data-theme-switcher aria-hidden="true">
  <span class="theme-switcher-label">Theme</span>
  <span class="theme-switcher-swatches">
    <span class="theme-switcher-swatch-slot"><span class="theme-switcher-swatch" data-theme-swatch="reference-blue" style="--theme-swatch: #1f527d"></span></span>
    <span class="theme-switcher-swatch-slot"><span class="theme-switcher-swatch" data-theme-swatch="burnt-orange" style="--theme-swatch: #a44d17"></span></span>
    <span class="theme-switcher-swatch-slot"><span class="theme-switcher-swatch" data-theme-swatch="oxide-red" style="--theme-swatch: #90382f"></span></span>
    <span class="theme-switcher-swatch-slot"><span class="theme-switcher-swatch" data-theme-swatch="moss" style="--theme-swatch: #4b653f"></span></span>
    <span class="theme-switcher-swatch-slot"><span class="theme-switcher-swatch" data-theme-swatch="aubergine" style="--theme-swatch: linear-gradient(135deg, #1b161a 0 50%, #d79cc4 50%)"></span></span>
    <span class="theme-switcher-swatch-slot"><span class="theme-switcher-swatch" data-theme-swatch="graphite" style="--theme-swatch: linear-gradient(135deg, #171b1d 0 50%, #8fc2dc 50%)"></span></span>
    <span class="theme-switcher-swatch-slot"><span class="theme-switcher-swatch" data-theme-swatch="sepia" style="--theme-swatch: #7b5128"></span></span>
  </span>
</div>
