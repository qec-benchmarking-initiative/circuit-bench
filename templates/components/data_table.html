<div class="table-scroll">
  <table class="data-table">
    <thead><tr>
      {% for column in columns %}
        <th scope="col"{% if column.numeric %} class="numeric"{% endif %}>
          {% if column.sortable %}<button type="button">{{ column.label }}{% if column.sort_index %} <span class="sort-mark">{{ column.sort_index }} {{ column.sort_direction }}</span>{% endif %}</button>{% else %}{{ column.label }}{% endif %}
        </th>
      {% endfor %}
    </tr></thead>
    <tbody>
      {% for row in rows %}
        <tr>{% for cell in row.cells %}<td{% if cell.numeric %} class="numeric"{% endif %}>{% if cell.url %}<a href="{{ cell.url }}">{{ cell.value }}</a>{% else %}{{ cell.value|default:"—" }}{% endif %}</td>{% endfor %}</tr>
      {% empty %}
        <tr><td colspan="{{ columns|length }}">No matching records.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
