{% if page.paginator.num_pages > 1 %}
  <nav class="submission-pagination" aria-label="{{ label|default:'Table' }} pages">
    {% if page.has_previous %}<a class="button button-secondary button-compact" href="{{ page_prefix }}{{ page_parameter }}={{ page.previous_page_number }}">Previous</a>{% endif %}
    <span>Page {{ page.number }} of {{ page.paginator.num_pages }} · {{ page.paginator.count }} records</span>
    {% if page.has_next %}<a class="button button-secondary button-compact" href="{{ page_prefix }}{{ page_parameter }}={{ page.next_page_number }}">Next</a>{% endif %}
  </nav>
{% endif %}
