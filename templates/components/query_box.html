<section class="query-box" aria-labelledby="{{ id_prefix }}-query-label">
  <div class="section-heading-row">
    <label id="{{ id_prefix }}-query-label" for="{{ id_prefix }}-query">Raw query</label>
    <a href="/about/query-syntax/">Query syntax and examples</a>
  </div>
  <textarea id="{{ id_prefix }}-query" name="query" rows="3" spellcheck="false">{{ query_text }}</textarea>
  <div class="query-actions">
    <button type="button">Run query</button>
    <button class="button-secondary" type="button">Clear</button>
  </div>
  <p class="query-status query-status-{{ query_status.kind }}" role="status">{{ query_status.message }}</p>
</section>
