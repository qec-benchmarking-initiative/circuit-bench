<details
  class="filter-grid control-grid"
  id="{{ grid.id }}"
  data-filter-grid
  data-ui-state-key="{{ grid.id }}"
  {% if grid.open %}open{% endif %}
>
  <summary>
    <span class="filter-grid-title">{{ grid.title }}</span>
    <span class="filter-grid-legend">{{ grid.legend }}</span>
  </summary>
  <div class="filter-grid-cells control-grid-cells" data-filter-grid-cells>
    {% for cell in grid.cells %}
      {% include "components/controls/grid_cell.html" with cell=cell only %}
    {% endfor %}
  </div>
</details>
