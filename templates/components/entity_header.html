<div class="entity-title-row">
  <div>
    <p class="eyebrow">{{ entity.kind }}</p>
    <h1>
      {{ entity.name }}
      {% if entity.version %}<span class="entity-version">v{{ entity.version }}</span>{% endif %}
    </h1>
  </div>
  {% include "components/status_badge.html" with status=entity.status label=entity.status_label only %}
</div>
{% include "components/tag_list.html" with tags=entity.tags label="Classification tags" only %}
