<details class="filter-strip filter-strip-machine" open>
  <summary>
    <span>Machine filters</span>
    <span class="filter-strip-description">execution hardware</span>
    {% if selected_machine_class %}<span class="filter-strip-active">active</span>{% endif %}
  </summary>
  <div class="filter-strip-controls">
    <div class="filter-control-group">
      <span class="filter-group-title">Machine type</span>
      <label class="compact-select-label">Class
        <select name="machine_class">
          <option value="">Any</option>
          {% for value, label in machine_classes %}<option value="{{ value }}"{% if selected_machine_class == value %} selected{% endif %}>{{ label }}</option>{% endfor %}
          <option value="unreported"{% if selected_machine_class == "unreported" %} selected{% endif %}>Unreported</option>
        </select>
      </label>
    </div>
  </div>
</details>
