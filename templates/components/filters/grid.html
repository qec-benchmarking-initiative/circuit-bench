<details class="filter-grid" id="{{ grid.id }}" data-filter-grid open>
  <summary>
    <span class="filter-grid-title">{{ grid.title }}<span class="filter-grid-applied" data-filter-applied-count>, {{ grid.applied_count }} applied</span></span>
    <span class="filter-grid-legend">selected values shown in the theme colour</span>
  </summary>
  <div class="filter-grid-cells" data-filter-grid-cells>
    {% for cell in grid.cells %}
      {% include "components/filters/grid_cell.html" with cell=cell only %}
    {% endfor %}
  </div>
</details>
