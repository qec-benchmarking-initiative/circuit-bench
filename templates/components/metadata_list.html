{% load scientific %}
<dl class="metadata-list">
  {% for item in items %}
    <div><dt>{{ item.label }}</dt><dd>{% if item.value == None %}—{% elif item.numeric %}{% scientific_number item.value profile=item.number_profile unit=item.unit %}{% else %}{{ item.value }}{% endif %}</dd></div>
  {% endfor %}
</dl>
