{% if tags %}
  <ul class="tag-list" aria-label="{{ label|default:'Tags' }}">
    {% for tag in tags %}
      <li><a class="tag tag-{{ tag.status }}" href="{% if tag.url %}{{ tag.url }}{% else %}?tag={{ tag.slug|urlencode }}{% endif %}">{{ tag.label }}</a></li>
    {% endfor %}
  </ul>
{% else %}
  <span class="muted">No tags</span>
{% endif %}
