{% csrf_token %}
{{ form.non_field_errors }}
{% for field in form %}
  <div class="form-row"><div class="form-row-label">{{ field.label_tag }}</div><div class="form-row-control">{{ field }}{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}{{ field.errors }}</div></div>
{% endfor %}
