{% load scientific %}
<details class="comparison-plot" id="{{ result_plot.id }}-panel" data-ui-state-key="{{ result_plot.id }}-panel"{% if result_plot.is_open %} open{% endif %}>
  <summary>
    <span class="comparison-plot-action">
      <span class="comparison-plot-action-show">Show plotter</span>
      <span class="comparison-plot-action-hide">Hide plotter</span>
    </span>
    <span>{% scientific_number result_plot.plotted_count "count" %}/{% scientific_number result_plot.total_count "count" %} points</span>
  </summary>
  {% include "components/result_plot.html" with plot=result_plot only %}
</details>
