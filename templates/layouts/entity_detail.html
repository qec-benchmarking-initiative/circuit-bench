{% extends "base.html" %}

{% block content %}
  <article class="page-shell record-layout">
    <header class="record-heading">{% block entity_heading %}{% endblock %}</header>
    <div class="record-columns">
      <div class="record-main">{% block entity_main %}{% endblock %}</div>
      <aside class="record-aside" aria-label="Record metadata">
        {% block entity_aside %}{% endblock %}
      </aside>
    </div>
    <section class="record-related">{% block entity_related %}{% endblock %}</section>
  </article>
{% endblock %}
