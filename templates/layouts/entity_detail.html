{% extends "base.html" %}

{% block content %}
  <article class="page-shell entity-layout">
    <header class="entity-heading">{% block entity_heading %}{% endblock %}</header>
    <div class="entity-columns">
      <div class="entity-main">{% block entity_main %}{% endblock %}</div>
      <aside class="entity-aside" aria-label="Record metadata">
        {% block entity_aside %}{% endblock %}
      </aside>
    </div>
    <section class="entity-related">{% block entity_related %}{% endblock %}</section>
  </article>
{% endblock %}
