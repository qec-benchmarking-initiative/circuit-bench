{% extends "base.html" %}

{% block title %}Upload development file — Circuit Bench{% endblock %}

{% block content %}
  <div class="page-shell compact-page">
    <header class="page-heading compact-page-heading">
      <h1>Upload a small file</h1>
    </header>
    <section class="form-bar-shell">
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {% include "components/form_bar_list.html" with form=form only %}
        <div class="form-actions"><button type="submit">Store and verify</button><a class="button button-secondary" href="{% url 'artifacts:index' %}">Cancel</a></div>
      </form>
    </section>
  </div>
{% endblock %}
