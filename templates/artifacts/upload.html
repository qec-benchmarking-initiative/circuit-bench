{% extends "base.html" %}

{% block title %}Upload development file — Circuit Bench{% endblock %}

{% block content %}
  <div class="page-shell">
    <header class="page-heading">
      <p class="eyebrow">Development inspection</p>
      <h1>Upload a small file</h1>
    </header>
    <section class="gallery-section">
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Store and verify</button>
        <a class="button button-secondary" href="{% url 'artifacts:index' %}">Cancel</a>
      </form>
    </section>
  </div>
{% endblock %}
